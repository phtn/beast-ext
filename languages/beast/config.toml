name = "Beast"
grammar = "beast"
path_suffixes = ["btsx"]
line_comments = ["// "]
tab_size = 2
hard_tabs = false
word_characters = ["-", "_"]
first_line_pattern = null

# Disable auto-close in strings/comments via overrides.scm
brackets = [
  { start = "(", end = ")", close = true, newline = false, not_in = [] },
  { start = "{", end = "}", close = true, newline = false, not_in = [] },
  { start = "[", end = "]", close = true, newline = false, not_in = [] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]

[overrides.string]
completion_query_characters = ["-"]

# Use tree-sitter-beast parser
[overrides.comment]
