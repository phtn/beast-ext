name = "Beast"
grammar = "beast"
path_suffixes = ["btsx"]
line_comments = ["// "]
tab_size = 2
hard_tabs = false
word_characters = ["-", "_"]

brackets = [
  { start = "(", end = ")", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "{", end = "}", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "[", end = "]", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]

[overrides.string]
completion_query_characters = ["-"]
